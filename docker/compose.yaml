# kakebo in the homelab.
# No published ports: the container is reached only by cloudflared over a shared Docker network.
# Copy .env.example to .env (same folder) and fill in the Cloudflare Access values.
name: kakebo

services:
  kakebo:
    image: ghcr.io/undermix96/kakebo:${KAKEBO_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - kakebo-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - cloudflared

volumes:
  kakebo-data:

networks:
  # Network shared with the existing cloudflared container (name to be confirmed).
  # In the tunnel config point the hostnames to http://kakebo:8080
  cloudflared:
    external: true
    name: ${CLOUDFLARED_NETWORK:-cloudflared}
