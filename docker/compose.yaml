# kakebo in the homelab.
# cloudflared runs elsewhere on the LAN and reaches the container through a published port:
# in the tunnel config point kakebo.undermix.it to http://<docker-host-lan-ip>:8080
# Every request except /healthz still requires a valid Cloudflare Access JWT (403 otherwise),
# so the LAN port does not bypass authentication.
# Copy .env.example to .env (same folder) and fill in the Cloudflare Access values.
name: kakebo

services:
  kakebo:
    image: ghcr.io/undermix96/kakebo:${KAKEBO_TAG:-latest}
    restart: unless-stopped
    env_file: stack.env
    ports:
      # Bind to the LAN interface only if you can, e.g. KAKEBO_BIND=192.168.1.10
      - "${KAKEBO_BIND:-0.0.0.0}:${KAKEBO_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - kakebo-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  kakebo-data:
